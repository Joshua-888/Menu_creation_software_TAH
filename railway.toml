# Railway — TakeAwayHero Menu Operator Portal
# Docker image includes Chromium + OS libs (libglib etc.) for live admin writes.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.portal"

[deploy]
startCommand = "npm run portal:start"
healthcheckPath = "/login"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
