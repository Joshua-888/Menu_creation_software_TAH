# Railway — TakeAwayHero Menu Operator Portal
# MUST use Docker so Chromium + OS libs are baked in (Railpack cold-starts 502).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.portal"

[deploy]
startCommand = "npm run portal:start"
healthcheckPath = "/login"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
