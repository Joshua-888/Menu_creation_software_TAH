# Railway — TakeAwayHero Menu Operator Portal
# Prefer Railpack until Docker Metal builds are stable (recent DOCKERFILE deploys
# fail at schedule). portal:start still brings HTTP up before Chromium download.
[build]
builder = "RAILPACK"

[deploy]
startCommand = "npm run portal:start"
healthcheckPath = "/login"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
