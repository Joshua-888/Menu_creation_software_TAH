# Railway — TakeAwayHero Menu Operator Portal
# Railpack (DOCKERFILE Metal builds were unstable). Chromium is installed during
# portal:build via scripts/ensure-playwright-chromium.mjs so Create ARTIFACTS
# does not wait on a cold playwright download. portal-start still self-heals.
[build]
builder = "RAILPACK"

[deploy]
startCommand = "npm run portal:start"
healthcheckPath = "/login"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
