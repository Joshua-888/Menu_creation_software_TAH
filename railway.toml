# Railway — TakeAwayHero Menu Operator Portal
[build]
builder = "RAILPACK"
# Chromium is required for live destination snapshot + Opdater writes
buildCommand = "npx playwright install --with-deps chromium && npm run portal:build"

[deploy]
startCommand = "npm run portal:start"
healthcheckPath = "/login"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
